[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpca"
version = "0.1.0"
description = "Multi-context Principal Component Analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kexin Wang" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


